<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#111111" />
  <title>Quadri che prendono vita</title>
</head>
<body>
  <section id="welcome" class="screen">
    <h1>Quadri che prendono vita</h1>
    <p class="privacy">La fotocamera serve solo a riconoscere il quadro: non registra e non invia nulla. Nessun dato personale viene raccolto.</p>
    <button id="start" class="big">Inizia</button>
    <p id="welcome-note" class="note"></p>
    <p class="note badge">Versione di prova tecnica (Fase 0)</p>
  </section>

  <section id="picker" class="screen" hidden>
    <h1>Scegli il quadro</h1>
    <nav id="painting-list"></nav>
  </section>

  <section id="loading" class="screen" hidden>
    <p class="big-text">Preparo la fotocamera…</p>
  </section>

  <section id="ar-screen" class="screen" hidden>
    <div id="ar"><video id="camera" muted playsinline autoplay></video></div>
    <div id="status" class="pill" role="status" aria-live="polite"></div>
    <div id="progress" class="pill pill-bottom"></div>
    <div id="reticle" aria-hidden="true"></div>
    <button id="fallback-btn" class="ghost">Non funziona? Guarda senza fotocamera</button>
    <div id="card" class="card" hidden role="dialog" aria-live="assertive">
      <h2></h2><p></p>
      <button id="card-close" class="big">Chiudi</button>
    </div>
  </section>

  <section id="fallback" class="screen scroll" hidden>
    <p id="fallback-reason" class="note"></p>
    <h1 id="fallback-title"></h1>
    <img id="fallback-img" alt="Immagine del quadro" />
    <h2>Particolari</h2>
    <ul id="fallback-list"></ul>
  </section>

  <pre id="debug" hidden></pre>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
